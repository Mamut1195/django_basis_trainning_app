name: Django checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: basis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: basis_trainning_app.test_settings
      DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/basis
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python scripts/architecture_check.py
      - run: python -m unittest discover -s tests_architecture
      - run: python -m mypy --config-file mypy-core.ini
      - run: python -m mypy --config-file mypy-django.ini
      - run: lint-imports
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test training.tests basis.modules.training.adapters.tests --noinput
      - run: python manage.py collectstatic --noinput
