{% extends 'base.html' %}{% block content %}<c-card>{% if validlink %}<form method="post" class="stack">{% csrf_token %}<h1>Nueva contraseña</h1><div class="form-fields">{{ form.as_div }}</div><c-ui.button type="submit" variant="primary">Guardar contraseña</c-ui.button></form>{% else %}<h1>El enlace ha caducado</h1><a href="{% url 'password_reset' %}">Solicitar otro enlace</a>{% endif %}</c-card>{% endblock %}
