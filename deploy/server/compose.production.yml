# Deployment for app.basisasesoria.fitness behind the host's existing Traefik.
# This file publishes no ports: the reverse proxy reaches basis-training-web:8000
# through the shared `coolify` network. Secrets live in .env next to this file.
name: basis-training

x-app: &app
  image: basis-training-app:local
  env_file: .env
  environment:
    DJANGO_DEBUG: "0"
    DJANGO_ALLOWED_HOSTS: "app.basisasesoria.fitness,localhost,127.0.0.1"
    DJANGO_HEALTH_HOST: "app.basisasesoria.fitness"
    PUBLIC_URL: "https://app.basisasesoria.fitness"
    CSRF_TRUSTED_ORIGINS: "https://app.basisasesoria.fitness"
    TRUST_PROXY: "1"
    BASIS_TRUSTED_PROXY_CIDRS: "10.0.1.0/24"
    AI_ENABLED: "0"
    POLAR_SANDBOX: "1"
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - coolify

services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: basis
      POSTGRES_DB: basis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basis -d basis"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - coolify

  web:
    <<: *app
    container_name: basis-training-web
    build:
      context: ./app
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "manage.py", "process_ai_jobs"]

  billing-worker:
    <<: *app
    command: ["python", "manage.py", "reconcile_billing", "--all", "--watch"]

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    profiles: ["operations"]

volumes:
  postgres_data:

networks:
  coolify:
    external: true
