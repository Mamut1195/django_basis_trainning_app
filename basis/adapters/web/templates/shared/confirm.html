{% extends 'shared/base.html' %}
{% block content %}
  <c-basis.card>
    <form method="post" class="stack">
      {% csrf_token %}
      <h1>{{ title }}</h1>
      <p>{{ text }}</p>
      <c-ui.button variant="primary" type="submit">
        {{ submit }}
      </c-ui.button>
    </form>
  </c-basis.card>
{% endblock %}
