{% extends 'shared/base.html' %}
{% block content %}
  <c-basis.card>
    {% if validlink %}
      <form method="post" class="stack" data-form-submit>
        {% csrf_token %}
        <c-basis.error-summary :form="form" />
        <h1>Nueva contraseña</h1>
        <div class="form-fields">{{ form.as_div }}</div>
        <c-ui.button type="submit" variant="primary">
          Guardar contraseña
        </c-ui.button>
        <c-basis.submit-status />
      </form>
    {% else %}
      <h1>El enlace ha caducado</h1>
      <a href="{% url 'password_reset' %}">Solicitar otro enlace</a>
    {% endif %}
  </c-basis.card>
{% endblock %}
