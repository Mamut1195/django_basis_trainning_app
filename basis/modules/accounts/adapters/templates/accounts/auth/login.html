{% extends 'shared/base.html' %}
{% block content %}
  <c-basis.page-heading title="Vuelve a tu ritmo." subtitle="Tu próxima sesión empieza aquí." />
  <c-basis.card>
    <form method="post" class="stack" data-form-submit>
      {% csrf_token %}
      <c-basis.error-summary :form="form" />
      <div class="form-fields">{{ form.as_div }}</div>
      <input type="hidden" name="next" value="{{ next }}">
      <c-ui.button type="submit" variant="primary">
        Iniciar sesión
      </c-ui.button>
      <c-basis.submit-status />
    </form>
  </c-basis.card>
  <div class="stack-sm">
    <p>
      <a href="{% url 'password_reset' %}">Olvidé mi contraseña</a>
    </p>
    <p>
      <a href="{% url 'resend-verification' %}">Verificar mi correo</a>
    </p>
    <p class="muted">
      ¿Primera vez? <a href="{% url 'signup' %}">Crea tu cuenta</a>
    </p>
  </div>
{% endblock %}
