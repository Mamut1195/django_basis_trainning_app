<c-basis.card>
  <div class="row">
    <div>
      <h2>Descanso</h2>
      <p class="muted">El temporizador continúa aunque cambies de pantalla.</p>
    </div>
    <div class="actions">
      <output aria-label="Tiempo de descanso restante"
              class="timer"
              data-timer-output
              aria-live="off">00:00</output>
      <button type="button" data-timer="60">60 s</button>
      <button type="button" data-timer="90">90 s</button>
      <button type="button" data-timer="120">120 s</button>
      <button type="button" data-timer="0" aria-label="Detener temporizador">Detener</button>
    </div>
  </div>
</c-basis.card>
