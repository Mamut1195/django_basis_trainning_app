[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", ".venv-win", ".cache", "artifacts", "**/migrations/*", "seed.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"daily_trainning_app/tests.py" = ["F401"]
"daily_trainning_app/views.py" = ["F401"]

