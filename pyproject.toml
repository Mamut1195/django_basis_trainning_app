[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", ".venv-win", ".cache", "artifacts", "**/migrations/*", "seed.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 100
max_attribute_length = 80
format_css = false
format_js = false
custom_html = 'c-[\w.-]+'
exclude = ".venv,.venv-win,.cache,artifacts,staticfiles,node_modules,docs"
