[mypy]
python_version = 3.13
files = basis, daily_trainning_app/strength_metrics.py, training/domain.py, training/access.py, training/billing.py, training/management/commands/reconcile_billing.py
plugins = mypy_django_plugin.main
strict = True
disallow_any_explicit = True
disallow_any_unimported = True
warn_unused_ignores = True
show_error_codes = True
cache_dir = .cache/mypy-django

[mypy.plugins.django-stubs]
django_settings_module = basis_trainning_app.test_settings
strict_settings = True


# Explicit legacy frontier: these three modules remain in legacy-pending.json.
# Analyze their symbols for the adapter, but do not certify their bodies yet.
# No migrated module is silenced; remove each entry when its ARCH stage migrates it.
[mypy-training.models,daily_trainning_app.models,training.services]
follow_imports = silent
