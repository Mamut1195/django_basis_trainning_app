[mypy]
python_version = 3.13
files = basis, config, manage.py, scripts/browser_smoke.py, scripts/acceptance_browser.py, scripts/ux_acceptance.py, scripts/client623_queue_regression.py, tests/regression, tests/__init__.py, scripts/verify_environment.py, scripts/backup_db.py, scripts/healthcheck.py, scripts/verify_operations.py, scripts/verify_gunicorn_logging.py, deploy/gunicorn_config.py, docs/design/verify_prototype.py
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
strict = True
explicit_package_bases = True
disallow_any_explicit = True
disallow_any_unimported = True
warn_unused_ignores = True
show_error_codes = True
cache_dir = .cache/mypy-django

[mypy.plugins.django-stubs]
django_settings_module = config.test_settings
strict_settings = True
