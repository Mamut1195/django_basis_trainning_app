[mypy]
python_version = 3.13
files =
    basis/__init__.py,
    basis/modules/__init__.py,
    basis/shared,
    scripts/architecture_check.py,
    tests_architecture,
    basis/modules/accounts/__init__.py,
    basis/modules/accounts/domain,
    basis/modules/accounts/application,
    basis/modules/accounts/public.py,
    basis/modules/athletes/__init__.py,
    basis/modules/athletes/domain,
    basis/modules/athletes/application,
    basis/modules/athletes/public.py,
    basis/modules/catalog/__init__.py,
    basis/modules/catalog/domain,
    basis/modules/catalog/application,
    basis/modules/catalog/public.py,
    basis/modules/training/__init__.py,
    basis/modules/training/domain,
    basis/modules/training/application,
    basis/modules/training/public.py,
    basis/modules/billing/__init__.py,
    basis/modules/billing/domain,
    basis/modules/billing/application,
    basis/modules/billing/public.py,
    basis/modules/coach/__init__.py,
    basis/modules/coach/domain,
    basis/modules/coach/application,
    basis/modules/coach/public.py,
    basis/modules/sync/__init__.py,
    basis/modules/sync/domain,
    basis/modules/sync/application,
    basis/modules/sync/public.py
strict = True
disallow_any_explicit = True
disallow_any_unimported = True
warn_unused_ignores = True
show_error_codes = True
cache_dir = .cache/mypy-core

explicit_package_bases = True
